<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aroma Cutting Board - Preparation Videos</title>
  <style>
    /* Ensure the page covers the full viewport */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    /* Style for the full-screen background video */
    .background-video {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: -1;
    }
    /* Container for the overlay content */
    .content {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      color: white;
      font-family: Arial, sans-serif;
    }
    /* Styling for links/buttons */
    a {
      display: inline-block;
      margin: 0.5em;
      padding: 0.5em 1em;
      text-decoration: none;
      border: 2px solid white;
      border-radius: 4px;
      color: white;
      transition: background 0.3s, color 0.3s;
    }
    a:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>
  <!-- Background video element -->
  <video class="background-video" autoplay loop muted playsinline>
    <source src="C0025_4.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- Content overlay -->
  <div class="content">
    <h1>Watch the Preparation Videos</h1>
    <p>Choose your preferred tutorial:</p>
    <p>
      <a href="YOUR_INSTAGRAM_REEL_URL" target="_blank">Quick Instagram Reel</a>
    </p>
    <p>
      <a href="YOUR_YOUTUBE_VIDEO_URL" target="_blank">Full YouTube Video</a>
    </p>
  </div>
</body>
</html>
