<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aroma Cutting Board - Preparation Videos</title>
  <style>
    /* Reset default styles */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }
    
    /* Background video styling */
    .background-video {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(1);
      min-width: 100%;
      min-height: 100%;
      object-fit: cover;
      object-position: center center;
      z-index: -2;
    }

    /* Dark overlay styling */
    .video-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4); /* Adjust opacity as desired */
      z-index: -1;
      pointer-events: none;
    }
    
    /* Mobile-specific adjustments */
    @media only screen and (max-width: 768px) {
      .background-video {
        object-fit: contain;
        width: 100vw;
        height: auto;
        background: black;
      }
    }
    
    /* Business logo styling */
    .logo {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 2;
    }
    .logo img {
      max-width: 120px;
      height: auto;
    }
    
    /* Overlay content styling */
    .content {
      position: relative;
      z-index: 3;
      text-align: center;
      padding: 2rem;
      color: white;
      font-family: Arial, sans-serif;
    }
    .content h1 {
      margin-top: 60px;
    }
    a {
      display: inline-block;
      margin: 0.5em;
      padding: 0.5em 1em;
      text-decoration: none;
      border: 2px solid white;
      border-radius: 4px;
      color: white;
      transition: background 0.3s, color 0.3s;
    }
    a:hover {
      background: white;
      color: black;
    }
  </style>
</head>
<body>
  <!-- Business Logo -->
  <div class="logo">
    <img src="logo.png" alt="Business Logo">
  </div>
  
  <!-- Background video element -->
  <video class="background-video" autoplay loop muted playsinline>
    <source src="C0025_4.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>
  
  <!-- Dark overlay -->
  <div class="video-overlay"></div>

  <!-- Content overlay -->
  <div class="content">
    <h1>Watch the Preparation Videos</h1>
    <p>Choose your preferred tutorial:</p>
    <p>
      <a href="YOUR_INSTAGRAM_REEL_URL" target="_blank">Quick Instagram Reel</a>
    </p>
    <p>
      <a href="YOUR_YOUTUBE_VIDEO_URL" target="_blank">Full YouTube Video</a>
    </p>
  </div>
</body>
</html>
